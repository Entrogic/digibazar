services:
  app:
    build: .
    container_name: winner_app
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: php artisan serve --host=0.0.0.0 --port=8000

  db:
    image: mysql:8.0
    container_name: winner_db
    restart: always
    environment:
      MYSQL_DATABASE: digibazar
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: sajid
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"